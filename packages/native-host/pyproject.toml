[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-job-host"
version = "0.1.0"
description = "Stealth native messaging host for AutoJob Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "curl_cffi>=0.7,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
auto-job-host = "auto_job_host.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_job_host"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
